<div class="upload">
  <h1>Upload Image</h1>
  <p>Select an image to upload to the system</p>
  
  <div class="upload-area" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
    <div class="upload-icon">
      <i class="fas fa-cloud-upload-alt"></i>
    </div>
    <h3>Drag & Drop your image here</h3>
    <p>or</p>
    <input type="file" #fileInput (change)="onFileSelected($event)" 
           accept="image/*" style="display: none">
    <button class="btn btn-primary" (click)="fileInput.click()">
      Browse Files
    </button>
  </div>
  
  <div *ngIf="selectedFile" class="preview">
    <h3>Selected Image:</h3>
    <img [src]="previewUrl" alt="Preview" style="max-width: 300px; max-height: 300px;">
    <div class="actions">
      <button class="btn btn-success" (click)="upload()" [disabled]="isUploading">
        <i class="fas fa-upload"></i> Upload
      </button>
      <button class="btn btn-danger" (click)="clear()">
        <i class="fas fa-times"></i> Clear
      </button>
    </div>
  </div>
  
  <div *ngIf="isUploading" class="uploading">
    <p>Uploading...</p>
  </div>
</div>
